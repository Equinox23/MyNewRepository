<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Dofus 3D</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#2b241d" />
  <link rel="icon" type="image/png" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <meta name="apple-mobile-web-app-title" content="Dofus 3D" />
  <!-- Polices et moteur 3D embarques : le jeu fonctionne hors ligne. -->
  <link rel="stylesheet" href="./vendor/fonts/fonts.css" />
  <link rel="stylesheet" href="./src/dofus-theme.css" />
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #0c0c14; color: #eee;
      font-family: "Trebuchet MS", "Helvetica Neue", sans-serif;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    canvas { display: block; }
    #hud {
      position: fixed; top: 12px; left: 12px;
      pointer-events: none;
      font-size: 14px; line-height: 1.4;
      color: #f1c40f;
      text-shadow: 1px 1px 2px #000, 0 0 4px #000;
    }
    #hud .row { margin-bottom: 2px; }
    #hud #title { font-size: 20px; font-weight: bold; }
    #hud #tip { font-style: italic; font-size: 12px; color: #ccc; }
    #hud #info { color: #fff; }
    #loader {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #1a140c;
      color: #ffcf5a;
      font-size: 18px;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="loader">Chargement de la 3D...</div>
  <div id="vignette"></div>
  <div id="hud">
    <div class="row" id="info"></div>
  </div>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
  <script type="module" src="./src/main.js"></script>
  <script>
    // Mode hors ligne : le service worker met tout le jeu en cache.
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
